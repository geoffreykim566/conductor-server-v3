# Local stack: Postgres + pgvector and the API. See README.md.
#   docker compose up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first created.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor -d conductor"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      args:
        DEV: "1"
    env_file: .env.local
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    # Tests, evals and run output aren't in the image; mounted so they're live
    # without a rebuild. app/ IS baked in: rebuild after editing it.
    volumes:
      - ./tests:/srv/tests
      - ./evals:/srv/evals
      - ./test_runs:/srv/test_runs
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
