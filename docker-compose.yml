# v3 pipeline — standalone stack, own repo, own database, no shared runtime
# with the real conductor-server. Run with: docker compose up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor -d conductor"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    env_file: .env.local
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    # Serves the /v1/chat, /v1/register HTTP layer (app/api.py) for
    # client-v3 to talk to. The old scenario-runner scripts (run_scenarios,
    # run_graded_battery, drive_turn) still work via `docker compose exec`
    # regardless of what the container's own foreground command is.
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
