# Second, isolated stack for testing a worktree/branch without touching the
# main server-v3 stack: no published ports (nothing to collide with on 8000 /
# 5435; drive it via `docker compose -p <name> ... exec app ...`), and the
# checkout bind-mounted over the image's /srv with PYTHONPATH=/srv so edits
# are live without a rebuild (the image pip-installs `app` into site-packages,
# which otherwise wins -- found 2026-09-18). Own pgdata volume per project
# name, so it must be seeded once: `exec app python -m app.embed_and_load`.
#
#   docker compose -p v034 -f docker-compose.yml -f docker-compose.standalone.yml up -d --build
services:
  db:
    ports: !reset []
  app:
    ports: !reset []
    volumes:
      - ./:/srv
    environment:
      PYTHONPATH: /srv
