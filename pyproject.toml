[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-server-v3"
version = "0.1.0"
description = "Conductor v3 pipeline: problem/solution-bucket KB + model-driven tool-calling loop."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "anthropic>=0.105",
    "pgvector>=0.3",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "slowapi>=0.1.9",
]

[tool.setuptools]
packages = ["app"]
