[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-server-v3"
version = "0.1.0"
description = "Conductor v3 server: Logic Pro assistant API, tool-calling pipeline, KB."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "anthropic>=0.105",
    "pgvector>=0.3",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyflakes>=3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.api.admin" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
